name: Build & publish website

# Rebuilds the site (and refreshes the map from CCP's static data) whenever code is pushed
# to main, every Tuesday after the usual patch window, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write   # lets the build save the refreshed Market Finder data back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test route planners
        run: npm test

      - name: Build site and map data
        run: npm run build

      # Keep the repo's copy of the Market Finder in step with the published one (fresh items,
      # systems and gates from CCP's data). Pushes made with this workflow's token don't start
      # another build, and [skip ci] makes sure of it.
      - name: Save refreshed Market Finder data to the repo
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          cp _site/market/index.html apps/market-finder/index.html
          if git diff --quiet -- apps/market-finder/index.html; then
            echo "Market Finder data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/market-finder/index.html
          git commit -m "Refresh Market Finder data from CCP's static data [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
